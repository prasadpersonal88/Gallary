<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d"><title>My Photo Gallery</title><link rel="stylesheet" href="style.css">
</head><body><main class="gallery">
<header><div><small>PHOTO GALLERY</small><h1>My Moments</h1></div><div class="counter"><span id="current">1</span> / <span id="total">0</span></div></header>
<section class="stage" id="stage">
<figure><img id="photo" src="" alt=""><div class="shade"></div><figcaption id="caption"></figcaption></figure>
<button class="nav prev" id="prev" aria-label="Previous photo">⌃</button><button class="nav next" id="next" aria-label="Next photo">⌄</button>
<div class="hint" id="hint">SWIPE UP OR DOWN</div><div class="progress"><span id="progress-bar"></span></div>
</section><footer><div id="dots" class="dots"></div><p>Swipe vertically to explore</p></footer>
</main><script src="script.js"></script></body></html>
